# G0DM0D3 API container only.
#
# Use this if you want the upstream API running as a managed container
# (e.g., for Podman autostart/autorestart) while running the MCP bridge
# separately — either in stdio mode for Hermes on the host, or as an
# HTTP bridge container via docker-compose.bridge-http.yml.
#
#   docker compose -f docker-compose.api.yml up -d --build
#
# The API is reachable from the host at http://localhost:7860 and from
# other containers on the shared `godmod3` network at http://godmod3-api:7860.
#
# NOTE: We build from a local Dockerfile.api instead of directly from the
# upstream repo because the upstream API currently uses Express route
# patterns that are incompatible with recent path-to-regexp versions.
# The local Dockerfile clones upstream and applies a compatibility patch.

services:
  godmod3-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: godmod3-api
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - GODMODE_API_KEY=${GODMODE_API_KEY:-}
      - GODMODE_TIER_KEYS=${GODMODE_TIER_KEYS:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_DATASET_REPO=${HF_DATASET_REPO:-}
    restart: unless-stopped
    networks:
      - godmod3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  godmod3:
    name: godmod3
    driver: bridge
