# Full stack: G0DM0D3 API + HTTP/SSE MCP bridge.
#
# This file simply includes the two split compose files so you can still
# start everything at once if you prefer:
#
#   docker compose up -d --build
#
# To manage the API and the HTTP bridge independently (e.g., run only the
# API container and use a local stdio bridge for Hermes), use the separate
# compose files directly:
#
#   docker compose -f docker-compose.api.yml up -d --build
#   docker compose -f docker-compose.bridge-http.yml up -d --build

include:
  - docker-compose.api.yml
  - docker-compose.bridge-http.yml
